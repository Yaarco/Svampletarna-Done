<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svampbloggen</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/blogg.css">
    <script src="./js/auth.js" defer></script>
    <script src="./js/blog.js" defer></script>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>
                    <a href="./index.html">
                        <img class="logo" src="./img/svampletarna-logo.png" alt="Svampletarna logotype">
                    </a>
                </li>
                <li><a href="./index.html">Alla svampar</a></li>
                <li><a href="./mina-fynd.html">Mina fynd</a></li>
                <li><a href="./om-svampar.html">Om svampar</a></li>
                <li><a href="./blogg.html" aria-current="page">Blogg</a></li>
                <li><a href="./login.html">Logga in</a></li>
            </ul>
        </nav>

        <div class="hero">
            <h1>Blogg</h1>
            <p>Här kan du läsa blogginlägg, och även lägga upp egna inlägg om du är inloggad.</p>
        </div>
    </header>
    <main>
        <section class="post-create">
            <h2>Skapa blogginlägg</h2>
            <form>
                <label for="title">Titel:</label>
                <input maxlength="50" type="text" name="title" id="title" required>

                <label for="content">Text:</label>
                <textarea name="content" id="content" rows="5" required></textarea>

                <button type="submit">Publicera</button>
            </form>
        </section>
        <section class="posts">
            <h2>Inlägg</h2>
            <!-- Inläggen skapas av js/blog.js -->
            <ol></ol>
        </section>
    </main>
    <footer>
        <p>Svampletarnas förening 2026</p>
    </footer>
</body>

</html>
