<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alla svampar</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/index.css">
    <script src="./js/auth.js" defer></script>
    <script src="./js/script.js" defer></script>
    <script src="./js/index.js" defer></script>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>
                    <a href="./index.html">
                        <img class="logo" src="./img/svampletarna-logo.png" alt="Svampletarna, till startsidan">
                    </a>
                </li>
                <li><a href="./index.html" aria-current="page">Alla svampar</a></li>
                <li><a href="./mina-fynd.html">Mina fynd</a></li>
                <li><a href="./om-svampar.html">Om svampar</a></li>
                <li><a href="./blogg.html">Blogg</a></li>
                <li><a href="./login.html">Logga in</a></li>
            </ul>
        </nav>

        <div class="hero">
            <h1>Alla svampar</h1>
            <p>
                Utforska alla svampar som föreningen har registrerat.
                Klicka på knappen när du har hittat en svamp så sparas den i dina fynd.
            </p>
        </div>
    </header>
    <main>
        <section class="svamp-lista">
            <h2>Svamplista</h2>
            <ul>
                <template>
                    <li>
                        <article>
                            <!-- Mall för ett svampkort, kopieras och fylls i av js/script.js -->
                            <img src="./img/exempelsvamp.jpg" alt="Exempelsvamp">
                            <h3>Exempelnamn svenska</h3>
                            <p>Exempelnamn latin</p>
                            <details>
                                <summary>Ätlig</summary>
                                <p>Ätbarhet</p>
                            </details>
                            <p>Beskrivning</p>
                            <p>Fyndplats</p>
                            <button type="button" class="btn-find">Markera som hittad</button>
                        </article>
                    </li>
                </template>
            </ul>
        </section>
    </main>
    <footer>
        <p>Svampletarnas förening 2026</p>
    </footer>
</body>

</html>
